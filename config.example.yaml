# cpa（隐私脱敏网关）示例配置
#
# 用法：把本文件内容放入 CPA 的 plugins.configs.privacygateway。
# 所有字段均可省略，省略时使用 defaultConfig()（见 config.go）。
# 校验：把本文件交给 parseConfig 即可（见 docs/design-docs/abi-contract.md）。

# —— 生命周期（宿主侧字段，插件解析但不读取，见 TD-CPA-017）——
enabled: true
priority: 0

# —— 准入控制 ——
# 在途请求上限；0 表示不限制。超限返回 429。
max_concurrency: 0
# 命中该关键词的请求直接终止（403），与 fail_closed 无关。
reject_keyword: ""
# 多个拒绝关键词（与 reject_keyword 合并）。
reject_keywords: []
# 检查的请求体上限（字节）；超限时按 fail_closed 处理。
max_body_bytes: 1048576

# —— 失败策略 ——
# true（默认）：不可解析 / 超限 / 格式不支持时拒绝而非放行。
fail_closed: true

# —— 状态表 ——
# 请求映射的存活时间（秒），到期由 janitor 清理。
request_ttl_seconds: 600
# 状态表条目上限，超限淘汰最旧。
max_requests: 8192
# 单请求占位符映射条数上限。
max_mappings: 1024
# 单请求占位符映射占用字节上限。
max_mapping_bytes: 1048576

# —— 脱敏范围 ——
# 是否也脱敏工具调用（tool call）参数字符串。
redact_tool_arguments: false
# 永不脱敏的字面值列表（字面子串匹配：正文中出现该子串即排除，不是整段精确相等）。
allowlist: []
# 自定义脱敏规则（RE2 正则）；命中的文本会进入同一请求映射并在响应侧还原。
# 例如：custom_rules: ['CUSTOM-[A-Z0-9]{8}']
custom_rules: []
# 安全 id 键名：键名不区分大小写、忽略 `_`/`-`；其值不参与高熵检测。
# 内置安全键名：process_id、pid、trace_id、request_id。
safe_id_keys: []
# 安全 id 前缀：区分大小写，至少 3 字符且以 `_` 或 `-` 结尾；
# 与已知密钥前缀（sk、gh、glpat、hf、npm 等）冲突时拒绝启动。
safe_id_prefixes: []

# —— 检测器开关与阈值 ——
detectors:
  credentials: true   # API key / token / bearer 等凭据
  entropy: true       # 高熵字符串（疑似密钥）
  email: true
  phone: true
  id_card: true       # 身份证号
  bank_card: true
  secret_context: true # 敏感键名（PASSWORD/TOKEN 等）的值不看熵直接脱敏
  # 高熵检测阈值：低于该熵值不判为敏感。
  min_entropy: 0
  # 高熵检测的最短长度。
  min_entropy_len: 0

# —— 管理界面与请求追踪 ——
# 是否在 CPA 管理界面暴露内嵌追踪页面（management 资源路由 trace）。
# 默认 false：页面会经浏览器持有管理密钥，生产环境建议保持关闭；
# 需要排障时改为 true 并重启 CPA。页面可见性 = panel.enabled 且 trace_enabled。
panel:
  enabled: false
# 是否把每个请求的脱敏事件写入内存环形缓冲（management 数据路由 GET/DELETE
# /v0/management/privacygateway/traces 读取）。默认 true；仅内存、仅掩码信息，不含原值。
trace_enabled: true
# 注册后是否立即开始记录。默认 false：页面点击「开始记录」后才采集（开启时清空旧记录）；
# 需要开机即记录（如排障期常驻）时改为 true。
trace_recording: false
# 内存中保留的请求记录条数，1..2000，默认 200；超限淘汰最旧记录并标记 partial。
trace_max_requests: 200
# 每条请求记录保留的事件条数，8..256，默认 64；总保有 request.complete 槽位。
trace_max_events: 64
